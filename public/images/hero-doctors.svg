<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Medical team illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1000" cy="150" r="220" fill="#ffffff" opacity="0.06"/>
  <circle cx="180" cy="760" r="260" fill="#ffffff" opacity="0.05"/>
  <!-- cross -->
  <g fill="#ffffff" opacity="0.9">
    <rect x="540" y="120" width="120" height="360" rx="22"/>
    <rect x="420" y="240" width="360" height="120" rx="22"/>
  </g>
  <!-- three staff members -->
  <g>
    <circle cx="330" cy="520" r="70" fill="#f8d7b5"/>
    <path d="M220 900 V700 Q220 610 330 610 Q440 610 440 700 V900 Z" fill="#ffffff"/>
    <path d="M300 610 L330 680 L360 610" fill="none" stroke="#0f766e" stroke-width="10"/>
    <circle cx="600" cy="470" r="80" fill="#e8c09a"/>
    <path d="M480 900 V680 Q480 580 600 580 Q720 580 720 680 V900 Z" fill="#dbeafe"/>
    <path d="M560 580 L600 650 L640 580" fill="none" stroke="#1e3a5f" stroke-width="10"/>
    <circle cx="880" cy="530" r="70" fill="#f1c9a5"/>
    <path d="M770 900 V700 Q770 610 880 610 Q990 610 990 700 V900 Z" fill="#ffffff"/>
    <path d="M850 610 L880 680 L910 610" fill="none" stroke="#0f766e" stroke-width="10"/>
  </g>
  <!-- hair -->
  <path d="M265 500 Q330 425 395 500 Q360 460 330 462 Q300 460 265 500 Z" fill="#3b2a20"/>
  <path d="M525 440 Q600 360 675 440 Q640 395 600 392 Q560 395 525 440 Z" fill="#2b2b2b"/>
  <path d="M810 500 Q880 430 950 500 Q910 462 880 462 Q845 462 810 500 Z" fill="#5b3a29"/>
</svg>

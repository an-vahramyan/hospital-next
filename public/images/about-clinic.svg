<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" role="img" aria-label="Clinic reception illustration">
  <rect width="1000" height="1100" fill="#e6f4f1"/>
  <!-- wall and floor -->
  <rect x="0" y="820" width="1000" height="280" fill="#cfe9e4"/>
  <!-- window -->
  <rect x="120" y="120" width="360" height="380" rx="14" fill="#bfe3ff"/>
  <path d="M300 120 V500 M120 310 H480" stroke="#ffffff" stroke-width="12"/>
  <!-- wall sign -->
  <rect x="580" y="140" width="300" height="120" rx="18" fill="#0f766e"/>
  <g fill="#ffffff">
    <rect x="715" y="160" width="30" height="80" rx="6"/>
    <rect x="675" y="185" width="110" height="30" rx="6"/>
  </g>
  <!-- reception desk -->
  <rect x="150" y="600" width="700" height="130" rx="14" fill="#ffffff"/>
  <rect x="150" y="720" width="700" height="34" fill="#94a3b8"/>
  <rect x="200" y="730" width="18" height="90" fill="#64748b"/>
  <rect x="782" y="730" width="18" height="90" fill="#64748b"/>
  <!-- bench -->
  <rect x="220" y="860" width="560" height="40" rx="10" fill="#1e3a5f"/>
  <rect x="250" y="900" width="26" height="110" fill="#334155"/>
  <rect x="724" y="900" width="26" height="110" fill="#334155"/>
  <!-- plant -->
  <rect x="830" y="780" width="90" height="90" rx="10" fill="#b45309"/>
  <ellipse cx="875" cy="740" rx="60" ry="90" fill="#16a34a"/>
  <!-- plaque -->
  <rect x="380" y="560" width="240" height="30" rx="6" fill="#dbeafe"/>
</svg>
